apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-nodejs
spec:
  replicas: 2  # Adjust the number of replicas as needed
  selector:
    matchLabels:
      app: app-nodejs
  template:
    metadata:
      labels:
        app: app-nodejs
    spec:
      containers:
      - name: app-nodejs
        image: app-nodejs:v0.0.0
        ports:
        - containerPort: 4000  # Change this to the port your app listens on

---

apiVersion: v1
kind: Service
metadata:
  name: app-nodejs
spec:
  selector:
    app: app-nodejs
  ports:
    - protocol: TCP
      port: 80        # Service port exposed externally
      targetPort: 4000 # The port on the container
  type: NodePort       # Change to ClusterIP or LoadBalancer if needed
