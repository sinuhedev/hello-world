version: "3.9"

services:
  postgres:
    # image: postgres:15.1-alpine
    image: postgres-pldebugger
    volumes:
      - ./.docker/data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - 5050:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=sinuhe.dev@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=password
