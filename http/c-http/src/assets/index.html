<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Index of {{URI}}</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: monospace;
      padding: 1.5rem 1rem;
      margin: 0;
      background: #242932;
      color: gray;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
    }

    h1 {
      border-bottom: 1px solid #444;
      padding-bottom: .5rem;
      font-size: clamp(1rem, 4vw, 1.4rem);
      word-break: break-all;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: .5rem 0;
      border-bottom: 1px solid #2e343f;
    }

    a {
      text-decoration: none;
      color: #98c2e1;
      word-break: break-all;
    }

    a:hover {
      color: #808a92;
    }

    .size {
      color: #556170;
      white-space: nowrap;
      font-size: 0.85em;
    }

    .upload-form {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      align-items: center;
      margin: 1rem 0 1.5rem;
      padding: 1rem;
      background: #2a303b;
      border: 1px dashed #444;
      border-radius: 6px;
    }

    .upload-form input[type="file"] {
      color: gray;
      flex: 1 1 200px;
    }

    .upload-form input[type="file"]::file-selector-button,
    .upload-form input[type="file"]::-webkit-file-upload-button {
      background: #3a4150;
      color: #98c2e1;
      border: 1px solid #4a5262;
      border-radius: 4px;
      padding: 15px;
      margin-right: .75rem;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s ease;
    }

    .upload-form input[type="file"]::file-selector-button:hover,
    .upload-form input[type="file"]::-webkit-file-upload-button:hover {
      background: #444c5c;
    }

    .upload-form button {
      background: #3a4150;
      color: #98c2e1;
      border: 1px solid #4a5262;
      border-radius: 4px;
      padding: 15px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .upload-form button:hover {
      background: #444c5c;
    }

    .upload-form button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(152, 194, 225, 0.3);
      border-top-color: #98c2e1;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .upload-form button.loading .spinner {
      display: inline-block;
    }

    .upload-form button.loading .btn-label {
      visibility: hidden;
      position: relative;
    }

    .upload-form button.loading .btn-label::after {
      content: "Upload...";
      visibility: visible;
      position: absolute;
      left: 0;
      white-space: nowrap;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .upload-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(36, 41, 50, 0.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      color: #98c2e1;
      font-family: monospace;
    }

    .upload-overlay.active {
      display: flex;
    }

    .upload-overlay .big-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(152, 194, 225, 0.2);
      border-top-color: #98c2e1;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @media (min-width: 600px) {
      body {
        padding: 2rem;
      }

      li {
        padding: .25rem 0;
      }
    }
  </style>
</head>

<body>
  <h1>Index of {{URI}}</h1>

  <form class="upload-form" id="upload-form" action="{{URI}}" method="POST" enctype="multipart/form-data">
    <input type="file" name="file" multiple required>
    <button type="submit" id="upload-btn">
      <span class="spinner"></span>
      <span class="btn-label">Upload</span>
    </button>
  </form>

  <div class="upload-overlay" id="upload-overlay">
    <div class="big-spinner"></div>
    <span>Upload files...</span>
  </div>

  <ul>
    {{LIST}}
  </ul>

  <script>
    document.getElementById('upload-form').addEventListener('submit', function () {
      document.getElementById('upload-btn').classList.add('loading')
      document.getElementById('upload-btn').disabled = true
      document.getElementById('upload-overlay').classList.add('active')
    })
  </script>
</body>

</html>
